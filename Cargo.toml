[package]
name = "dto_derive"
description = """
Derive for automatic mapping DTOs to Entities and vice versa.
"""
version = "0.1.1"
authors = ["Michał Blinkiewicz <michal.blinkiewicz@gmail.com>"]
repository = "https://github.com/mb1986/dto_derive"
readme = "README.md"
license = "MIT"
keywords = ["dto", "data", "transfer", "entity", "derive"]
categories = ["data-structures", "web-programming", "rust-patterns"]
edition = "2024"
rust-version = "1.85"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"

[dev-dependencies]
compiletest_rs = { version = "=0.3.19", features = ["stable"] }
